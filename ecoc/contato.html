<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - EcoTech Solutions</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <div class="logo-icon">🌱</div>
            <h1>EcoTech</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html">Serviços</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <section class="contato">

        <h1>Entre em Contato</h1>

        <p>
            Envie sua dúvida, sugestão ou solicite mais informações
            sobre nossos serviços.
        </p>


        <form>

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone"
            >


            <label for="assunto">
                Assunto
            </label>

            <input
                type="text"
                id="assunto"
                name="assunto"
                placeholder="Digite o assunto"
                required
            >


            <label for="mensagem">
                Mensagem
            </label>

            <textarea
                id="mensagem"
                name="mensagem"
                rows="6"
                placeholder="Digite sua mensagem"
                required
            ></textarea>


            <button type="submit">
                Enviar Mensagem
            </button>

        </form>

    </section>


    <footer>

        <p>
            © 2026 EcoTech Solutions - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
